name: Build and test Byte Odyssey
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: byte-odyssey-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: Byte-Odyssey-Web
          path: dist/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  windows:
    needs: web
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Windows installers
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) {
            $details = (Get-Content windows-build.log -Tail 40) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows packaging failed::$details"
            exit 1
          }
      - name: Test packaged desktop application
        run: node scripts/smoke-desktop.mjs "release/win-unpacked/Byte Odyssey.exe"
      - name: Package web build and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path dist/* -DestinationPath "release/Byte-Odyssey-$version-Web.zip"
          if ((Get-ChildItem release -Filter *.exe).Count -ne 2) { throw 'Expected Setup and Portable executables.' }
          $files = Get-ChildItem release -File | Where-Object { $_.Extension -in @('.exe', '.zip') }
          $lines = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Byte-Odyssey-Windows
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release -File | Where-Object { ($_.Extension -in @('.exe', '.zip')) -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @files --verify-tag --title "Byte Odyssey $env:RELEASE_TAG" --notes-file docs/release-notes.md
